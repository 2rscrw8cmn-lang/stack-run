name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply issue 169 lockfile patch
        if: github.head_ref == 'fix/169-brace-expansion-audit'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package-lock.json'
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'))
          const entry = lock.packages?.['node_modules/brace-expansion']

          if (!entry) throw new Error('brace-expansion lock entry not found')

          if (entry.version === '5.0.8') {
            entry.version = '5.0.9'
            entry.resolved = 'https://registry.npmjs.org/brace-expansion/-/brace-expansion-5.0.9.tgz'
            entry.integrity = 'sha512-ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg=='
            fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`)
          } else if (entry.version !== '5.0.9') {
            throw new Error(`unexpected brace-expansion version: ${entry.version}`)
          }
          NODE

          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already contains brace-expansion 5.0.9.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Fix brace-expansion audit finding'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Clean install
        run: npm ci
      - name: Repository check
        run: npm run check
      - name: Whitespace integrity
        run: git diff --check
