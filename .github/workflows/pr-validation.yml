name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Diagnose Evolution 2.08
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Evolution 2.08 focused regression
        run: npx vitest run src/history/crossTrainingHistory.test.ts --reporter=verbose
      - name: History and signal regression
        run: npx vitest run src/history src/signals --reporter=verbose
      - name: Runs and detail regression
        run: npx vitest run src/features/runs src/features/workout-detail --reporter=verbose
      - name: Production build
        run: npm run build
      - name: Whitespace integrity
        run: git diff --check
