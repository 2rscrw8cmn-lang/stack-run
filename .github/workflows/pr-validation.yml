name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Diagnose Evolution 2.08 UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: History Explorer
        run: npx vitest run src/features/runs/HistoryExplorer.test.tsx --reporter=verbose
      - name: Runs screen
        if: always()
        run: npx vitest run src/features/runs/Runs.test.tsx --reporter=verbose
      - name: Runner History
        if: always()
        run: npx vitest run src/features/runs/RunnerHistory.test.tsx --reporter=verbose
      - name: Historical detail
        if: always()
        run: npx vitest run src/features/runs/HistoricalRunSheet.test.tsx --reporter=verbose
      - name: Accepted run detail
        if: always()
        run: npx vitest run src/features/workout-detail/RunResultDetail.test.tsx --reporter=verbose
      - name: Production build
        if: always()
        run: npm run build
      - name: Whitespace integrity
        if: always()
        run: git diff --check
