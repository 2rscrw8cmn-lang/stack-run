name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Evolution 2.08 Cross Training history patch
        if: github.head_ref == 'evolution/159-cross-training-history'
        shell: bash
        run: |
          python <<'PY'
          import subprocess

          previous = subprocess.check_output(
              ["git", "show", "HEAD^:.github/workflows/pr-validation.yml"],
              text=True,
          )
          marker = "          python <<'PY'\n"
          start = previous.index(marker) + len(marker)
          end = previous.index("\n          PY", start)
          script = previous[start:end]

          old = '''          replace("src/features/runs/HistoryExplorer.tsx", 'zones: runs.some((run) => run.hrZoneSeconds !== null),', 'zones: running.some((run) => run.hrZoneSeconds !== null),')'''
          new = '''          replace(\n              "src/features/runs/HistoryExplorer.tsx",\n              'zones: runs.some(\\n      (run) => run.hrZoneSeconds !== null && run.hrZoneSeconds.some((seconds) => seconds > 0),\\n    ),',\n              'zones: running.some(\\n      (run) => run.hrZoneSeconds !== null && run.hrZoneSeconds.some((seconds) => seconds > 0),\\n    ),',\n          )'''
          if old not in script:
              raise RuntimeError("expected prior History zones matcher not found")
          script = script.replace(old, new, 1)
          exec(compile(script, "evolution159_patch", "exec"))
          PY

          if git diff --quiet -- . ':!.github/workflows/pr-validation.yml'; then
            echo 'Evolution 2.08 patch already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src docs
            git commit -m 'Implement Cross Training actual history semantics'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Clean install
        run: npm ci
      - name: Repository check
        run: npm run check
      - name: Whitespace integrity
        run: git diff --check
