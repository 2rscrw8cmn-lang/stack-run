name: Temporary Award Check

on:
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Normalize pre-existing duplicate migration version
        run: |
          # main currently contains two unrelated 20260814120000 migrations.
          # Rename one only inside this disposable CI workspace so Supabase can
          # build the existing schema before exercising the Special Block SQL.
          mv supabase/migrations/20260814120000_runner_icon_backdrop.sql \
            supabase/migrations/20260814120100_runner_icon_backdrop.sql
      - name: Start local Supabase
        run: supabase start
      - name: Run database tests
        run: supabase test db
