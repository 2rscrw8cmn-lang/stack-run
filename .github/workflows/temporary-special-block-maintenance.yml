name: Temporary Special Block Maintenance

on:
  push:
    branches: [feature/award-block-visual-study]

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/award-block-visual-study
          fetch-depth: 0
      - name: Apply one-time Special Block maintenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          migration = Path('supabase/migrations/20260819025500_crew_special_blocks.sql')
          text = migration.read_text()
          text = text.replace('  row integer,\n', '  build_row integer,\n')
          text = re.sub(r'\b([A-Za-z_][A-Za-z0-9_]*)\.row\b', r'\1.build_row', text)
          migration.write_text(text)

          decision = Path('docs/DECISION_LOG_ADDENDUM.md')
          text = decision.read_text()
          if '## D-079 — Crew Special Blocks are zero-mile weekly Crew awards' not in text:
              text += '''\n\n## D-079 — Crew Special Blocks are zero-mile weekly Crew awards\n\n**Decision**\n\nCrew Special Blocks are approved as winner-owned, zero-mile pieces that physically participate in the shared Crew Build. Each completed week can produce four standard awards — Most Miles, Best Zone 2, Fastest Avg. Pace, and Most Runs — plus one Feature award rotating weekly through Long Haul, Steady, On Target, and Level Up. Only the winner may place or move the award block. Run blocks and award blocks share the same authoritative collision/support geometry, while `Miles Built` remains the sum of placed run mileage only.\n\nThe Crew-safe projection is extended only for derived award scalars: `award_zone2_percent`, `award_target_percent`, `award_level_up_percent`, and `award_steady_seconds` when a verified source exists. Raw heart rate, HR-zone arrays, workout targets/details, routes, exact start times, notes, credentials, and personal history remain private. Award-score sync is scoped to `auth.uid()` so a runner cannot submit or alter another runner's award metrics.\n\n`Steady` must not fabricate a score from average pace. Until STACK has a verified within-run pace-variability source, a Steady week may have no qualifier.\n\n**Reason**\n\nThis preserves the Crew Build as the product's shared artifact, gives weekly competition a permanent visual history, and keeps health/training source data on the runner's side of the privacy boundary.\n\n**Status**\n\nApproved for the Crew Special Blocks implementation. See `docs/CREW_SPECIAL_BLOCKS.md`.\n'''
              decision.write_text(text)

          structure = Path('docs/CURRENT_APPLICATION_STRUCTURE.md')
          text = structure.read_text()
          if '## 2026-08-18 — Crew Special Blocks' not in text:
              text += '''\n\n## 2026-08-18 — Crew Special Blocks\n\nCrew now has a separate weekly award domain in addition to shared runs. `crew_award_blocks` stores immutable weekly winners and zero-mile Crew Build placement. The client derives privacy-safe scalar award scores locally, syncs only those scalars onto the runner's own `shared_runs` rows, and the server finalizes completed-week awards idempotently.\n\nThe shared Crew Build geometry is now a discriminated union of run rectangles and award rectangles. Both kinds collide with and support each other through the same eight-column placement rules, but `placedMiles` and Miles Built remain run-only. Production award rendering lives in `src/features/crew/AwardBrick.tsx` and `src/features/crew/awardBlock.css`; live standings and award placement/detail flows are wired through `CrewAwardsPanel`, `CrewAwardDetailSheet`, `useCrewAwards`, and `crewAwardsService`.\n\nSee `docs/CREW_SPECIAL_BLOCKS.md` and D-079 for scoring, lifecycle, and the derived-scalar privacy exception.\n'''
              structure.write_text(text)

          phase = Path('docs/PHASE_STATUS.md')
          text = phase.read_text()
          if '## Crew Special Blocks — implementation review' not in text:
              text += '''\n\n## Crew Special Blocks — implementation review\n\n**Status:** Implemented on draft PR #123; not merged to `main`.\n\nImplemented scope:\n- four standard weekly awards: Most Miles, Best Zone 2, Fastest Avg. Pace, Most Runs;\n- one weekly rotating Feature award: Long Haul / Steady / On Target / Level Up;\n- winner-owned zero-mile award persistence and READY placement;\n- approved graphite award artwork with runner identity and award-specific glyph/color;\n- live weekly standings and award detail/move flow;\n- mixed run/award collision and support in the authoritative Crew Build RPCs;\n- run-only Miles Built accounting;\n- RLS and winner-only placement;\n- derived-scalar award projection without raw HR-zone, workout-target, route, credential, or personal-history disclosure.\n\nVerification on the feature branch includes lint, TypeScript/Vite build, Vitest, Vercel preview, and dedicated Supabase/RLS coverage. `Steady` intentionally remains without a fabricated fallback until a verified within-run pace-variability source is available.\n'''
              phase.write_text(text)
          PY
      - name: Commit maintenance changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260819025500_crew_special_blocks.sql docs/DECISION_LOG_ADDENDUM.md docs/CURRENT_APPLICATION_STRUCTURE.md docs/PHASE_STATUS.md
          if git diff --cached --quiet; then
            echo 'No maintenance changes needed.'
            exit 0
          fi
          git commit -m 'Document and harden Crew Special Blocks'
          git push origin HEAD:feature/award-block-visual-study
